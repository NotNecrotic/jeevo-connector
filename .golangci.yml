version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      # Closing something we only read from has no error worth handling; writes are checked on flush.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net/http.Server).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - os.Remove
        - os.RemoveAll
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers this
        - G204 # subprocess with variable args: ffmpeg/python paths come from config
        - G304 # file path from variable: paths are built from config and ids
        - G301 # 0755 dirs are intended (the service user owns them)
        - G302
        - G306
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose]
      - path: \.gen\.go$
        linters: [all]

formatters:
  enable:
    - gofmt
